repository_security:
  stage: security
  image:
    name: aquasec/trivy:0.72.0
    entrypoint: [""]
  timeout: 25m
  variables:
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/trivy"
  cache:
    key: trivy-0.72.0
    paths: [.cache/trivy/]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SECURITY_SCAN == "weekly"'
  script:
    - trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --skip-dirs teams/octo/samples --skip-dirs teams/synthify/samples --skip-dirs evaluation/datasets/generated --skip-dirs evaluation/leaderboard/node_modules .
