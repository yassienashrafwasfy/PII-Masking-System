pre_commit:
  extends: .mr_only_rules
  stage: validate
  cache:
    key:
      files:
        - uv.lock
        - .pre-commit-config.yaml
    paths:
      - .cache/uv/
      - .pre-commit-cache/
  before_script:
    - apt-get update && apt-get install --yes --no-install-recommends git
    - uv sync --locked
  script:
    - uv run --no-sync pre-commit run --all-files --show-diff-on-failure

fast_checks:
  extends: .mr_only_rules
  stage: validate
  timeout: 25m
  cache:
    key:
      files: [uv.lock]
    paths: [.cache/uv/]
  before_script:
    - uv sync --locked
  script:
    - uv run --no-sync python scripts/validate_repository.py
    - uv run --no-sync python evaluation/scripts/validate_contracts.py
    - uv run --no-sync python platform/masking-gateway/tests/test_gateway.py
    - uv run --no-sync python platform/model-service/tests/test_service.py
    - uv run --no-sync python platform/masking-gateway/tests/test_document_pipeline.py
    - uv run --no-sync python platform/masking-gateway/tests/test_pdf_redaction_styles.py
    - uv run --no-sync python platform/masking-gateway/tests/test_converter_samples.py
    - uv run --no-sync python platform/masking-gateway/tests/test_orchestrator.py
    - uv run --no-sync python platform/masking-gateway/tests/test_shared_adapter.py
    - uv run --no-sync python platform/masking-gateway/tests/test_qa_label_schema.py
    - uv run --no-sync python platform/masking-gateway/tests/test_phone_spans.py
    - uv run --no-sync python platform/masking-gateway/tests/test_belgian_identifiers.py
    # Named by no job until now, so nothing ran them. test_masking_router
    # had no runner at all and its 20 cases -- every surrogate rule, and
    # every French one added with the locale work -- had never executed.
    - uv run --no-sync python platform/masking-gateway/tests/test_masking_router.py
    - uv run --no-sync python platform/masking-gateway/tests/test_octo_address_spans.py
    - uv run --no-sync python platform/masking-gateway/tests/test_locale_detection.py
    # Pure numpy: no model artifact, no ONNX Runtime, no LFS. It also pins
    # the lazy-import guarantee the package docstring claims, which was
    # documented in prose and asserted nowhere.
    - uv run --no-sync python platform/masking-gateway/tests/test_ocr_engine.py
    - uv run --no-sync python platform/masking-gateway/tests/test_pdf_ocr.py
    - uv run --no-sync python platform/masking-gateway/tests/test_pdf_content_order.py
    - uv run --no-sync python platform/masking-gateway/tests/test_pdf_line_reflow.py
    - uv run --no-sync python platform/masking-gateway/tests/test_pdf_unmaskable_channels.py
    # Every file above is named one at a time, and 14 of the gateway's test
    # files had ended up named by no job at all -- test_settings.py,
    # test_regex_rules.py, test_checksums.py, the four regex/surrogate corpora,
    # the two PDF layout files and the rest. They have no `main()`, so
    # `python <file>` would run nothing even if they were listed. This step
    # collects the directory instead, so a new test file is run by default
    # rather than on remembering to add a line here. The three ignores are the
    # files that need something this stage does not have: Docker, or the LFS
    # model artifacts the ml stage fetches. The duplication with the lines
    # above is deliberate and costs about two seconds; those invocations run
    # each file's own `main()`, which is not always the collected tests.
    - uv run --no-sync python -m pytest -q platform/masking-gateway/tests
      --ignore=platform/masking-gateway/tests/test_compose_smoke.py
      --ignore=platform/masking-gateway/tests/test_qa_model_integration.py
      --ignore=platform/masking-gateway/tests/test_qa_api_end_to_end.py
    - uv run --no-sync python tests/test_repository_layout.py
    - uv run --no-sync python tests/test_deployment_scripts.py
    - uv run --no-sync python tests/test_transactional_deployment.py
    - uv run --no-sync python tests/test_ci_production_promotion.py
    # Pins the arena's CI wiring and its MLflow-VPS compose file. It was never
    # invoked by any job, so nothing checked it; it costs well under a second.
    - uv run --no-sync python tests/test_arena_mlflow_vps_deployment.py
    - PYTHONPATH=evaluation uv run --no-sync python -m pytest -q evaluation/tests --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
    expire_in: 1 week
