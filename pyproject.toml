[project]
name = "pii-masking-demo"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3==1.40.1",
    "Faker==38.2.0",
    "fastapi==0.140.0",
    "gliner==0.2.28",
    "lingua-language-detector==2.2.0",
    "onnxruntime==1.28.0",
    "PyMuPDF==1.28.0",
    "torch==2.7.0+cpu",
    "transformers==5.10.1",
]

[dependency-groups]
dev = [
    "black==26.3.1",
    "hadolint-py==2.15.1.3",
    "mypy==2.4.1",
    "pre-commit==4.3.0",
    "pre-commit-hooks==6.0.0",
    "pytest==8.4.2",
    "python-multipart>=0.0.20,<1",
    "radon==6.0.1",
    "ruff==0.14.2",
    "types-pyyaml>=6.0.12.20261113",
    "xenon==0.9.3",
]

# `mutmut run` leaves a full copy of the gateway's src and tests under
# platform/masking-gateway/mutants/. It is gitignored, but pytest still walks
# into it from the repository root and fails to collect every file in it -- the
# copy has no importable `masking_engine` on its path, so a plain `pytest` after
# a mutation run reports 72 collection errors that have nothing to do with the
# tree. The default norecursedirs list is repeated here because setting the
# option replaces it rather than adding to it.
[tool.pytest.ini_options]
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
    "mutants",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# Static type checking, run by `scripts/check_types.py` (one mypy invocation per
# source group, because several groups hold test files with identical module
# names that a single run reports as duplicates). The pre-commit hook and CI
# both call that script, so there is one definition of "type-clean".
#
# mypy_path mirrors the sys.path entries the tests and entrypoints add at run
# time, so `masking_engine` resolves to the real source in this tree and a team
# adapter is checked against the platform's actual signatures rather than `Any`.
[tool.mypy]
python_version = "3.12"
mypy_path = [
    # What the tests and entrypoints put on sys.path at run time.
    "platform/masking-gateway/src",
    "platform/model-service/src",
    "platform",
    "evaluation",
    "evaluation/tests",
    "scripts",
    "teams/octo/training",
]
explicit_package_bases = true
namespace_packages = true
warn_unused_ignores = true
warn_redundant_casts = true

# Third-party libraries that ship no type information (no py.typed, no stub
# package on PyPI that this lock can install). Listed by name so a typo in a
# first-party import is still an error; a blanket ignore_missing_imports would
# hide exactly that.
[[tool.mypy.overrides]]
module = [
    "onnxruntime.*",
    "boto3.*",
    "botocore.*",
    "gliner.*",
    "mlflow.*",
    "pyarrow.*",
    "pandas.*",
    "reportlab.*",
    "pypdf.*",
    "peft.*",
]
ignore_missing_imports = true

# `platform/` is on mypy_path so `from common import http` resolves, which also
# exposes the README-only directories platform/mlflow, platform/nifi and
# platform/r2 as empty namespace packages. `mlflow` is not installed here, so
# the empty directory would win the import and every `mlflow.start_run` would
# read as a missing attribute. Treating it as Any is what the line above does
# for the real library. Same for `datasets`: evaluation/ is on mypy_path and
# holds an evaluation/datasets directory that hides HuggingFace `datasets`.
[[tool.mypy.overrides]]
module = ["mlflow", "datasets"]
follow_imports = "skip"

# Dead-code search, the complement to mutation testing: mutmut asks whether a
# test notices a change, vulture asks whether anything runs the code at all. A
# detector nobody calls masks nothing and no green suite says so.
#
# Not a dependency on purpose, for the same reason mutmut is not: `uv sync
# --locked` removes anything not in the lock file, and neither tool is needed to
# run or serve the service. Install it for a run (`uv pip install vulture`) and
# invoke `vulture .` from the repository root -- this section is inert without it.
#
# 60 is the level at which the remaining reports are worth reading. Names below
# that are dominated by framework callbacks and attribute-only dataclasses.
[tool.vulture]
min_confidence = 60
paths = ["."]
exclude = [
    ".venv",
    "*/mutants/*",
    "*/node_modules/*",
    "graphify-out",
    # Offline, team-owned experiment scripts. A trial keeps the branch it
    # decided against on purpose, and its owners -- not this check -- decide
    # when it goes. What this check guards is the serving path. Reported at the
    # time of writing and left to the teams: `prepare_dataset` in octo's
    # prepare_datasets.py has no caller, and berts' `Hit`/`merge_fallback` are
    # documented leftovers of a trial.
    "*/training/*",
]
ignore_decorators = [
    # FastAPI and Flask reach their handlers through the decorator, never by
    # name, so every route reads as unused.
    "@app.*",
    "@router.*",
    # An autouse fixture is called by pytest, not by a test.
    "@pytest.fixture",
    # pydantic calls a validator during construction; nothing names it.
    "@field_validator",
]
ignore_names = [
    # Interfaces called by something outside Python's view of the code.
    "do_GET",             # http.server dispatches on the method name
    "do_POST",
    "log_message",
    "forward",            # torch calls it through __call__
    "__getattr__",        # module-level lazy imports
    "__dir__",
    "image_samples",      # a PageReader stub keeping the protocol's signature
    # onnxruntime SessionOptions attributes, set once and read by the C++ side.
    "enable_cpu_mem_arena",
    "intra_op_num_threads",
    "inter_op_num_threads",
    "graph_optimization_level",
    "log_severity_level",
    "execution_mode",
    # gunicorn reads its configuration module by attribute name.
    "bind",
    "workers",
    "worker_class",
    "timeout",
    "graceful_timeout",
    "keepalive",
    "accesslog",
    "errorlog",
    "loglevel",
    "preload_app",
    "threads",
    "access_log_format",
    "capture_output",
    # pymupdf Widget fields, written from Python and read by MuPDF itself.
    "field_name",
    "field_type",
    # transformers TrainerCallback hooks and Trainer overrides: the framework
    # calls them, the training scripts never do.
    "on_train_begin",
    "on_step_end",
    "on_log",
    "on_epoch_end",
    "on_train_end",
    "on_save",
    "_get_train_sampler",
]
