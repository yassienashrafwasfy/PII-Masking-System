# Mutation testing for the platform-owned gateway and masking engine.
#
#   cd platform/masking-gateway && uv run python -m mutmut run
#
# mutmut derives a mutant's key from the file path relative to the working
# directory, so it has to run from the package root where `src/` is the
# importable source dir -- not from the repository root.
[mutmut]
source_paths =
    src

also_copy =
    tests

# Only platform-owned logic that the test selection below genuinely pins.
# Everything else under src/ is copied verbatim so imports still resolve.
only_mutate =
    src/gateway.py
    src/masking_engine/app/engines/*.py
    src/masking_engine/app/services/pdf_content_order.py
    src/masking_engine/app/services/pdf_extraction.py
    src/masking_engine/app/services/pdf_text_fitting.py
    src/masking_engine/app/core/config.py

# The subset that runs in ~2s and needs neither model weights nor LFS
# artifacts. Tests reaching into teams/ are excluded on purpose: mutation
# testing runs the suite once per mutant, so the selection has to stay cheap.
pytest_add_cli_args_test_selection =
    tests/test_address_spans.py
    tests/test_belgian_identifiers.py
    tests/test_checksums.py
    tests/test_contact_spans.py
    tests/test_date_spans.py
    tests/test_document_pipeline.py
    tests/test_gateway.py
    tests/test_label_converter.py
    tests/test_locale_detection.py
    tests/test_masking_router.py
    tests/test_orchestrator.py
    tests/test_pdf_content_order.py
    tests/test_pdf_content_stream.py
    tests/test_pdf_layout.py
    tests/test_pdf_line_reflow.py
    tests/test_pdf_redaction_styles.py
    tests/test_pdf_text_fitting.py
    tests/test_pdf_unmaskable_channels.py
    tests/test_phone_spans.py
    tests/test_qa_label_schema.py
    tests/test_regex_corpus.py
    tests/test_regex_rules.py
    tests/test_settings.py
    tests/test_span_shape.py
    tests/test_token_classifier_decode.py
    tests/test_surrogate_identifiers.py
    tests/test_surrogates.py

pytest_add_cli_args =
    -p
    no:cacheprovider
