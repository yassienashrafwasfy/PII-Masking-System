server {
  # 8080, not 80: this container runs as the unprivileged `nginx` user (see the
  # Dockerfile), and binding below 1024 would need CAP_NET_BIND_SERVICE, which
  # the deployment drops. Traefik's `loadbalancer.server.port` label and both
  # compose healthchecks must name this same port.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://leaderboard-api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Interactive masking runs upload documents up to the gateway's 10 MiB
    # ceiling; nginx would otherwise reject them with 413 at its 1 MiB default.
    client_max_body_size 12m;
    proxy_request_buffering off;

    # A masking run is polled, not held open, but reading a document back out
    # of object storage can outlast the 60s default.
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # The side-by-side viewer renders PDFs in a same-origin iframe, which the
    # server-level X-Frame-Options DENY would block. add_header in a location
    # replaces the inherited set, so the others are repeated here deliberately.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
}
